x-airflow-common: &airflow-common
  build: ./services/airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://web_manga:web_manga@postgres:5432/web_manga
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: web_manga_local_airflow_secret
    WEB_MANGA_PROJECT_ROOT: /opt/airflow/project
    DATABASE_URL: ${DATABASE_URL:-postgresql://web_manga:web_manga@postgres:5432/web_manga}
    POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
    POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    POSTGRES_DB: ${POSTGRES_DB:-web_manga}
    POSTGRES_USER: ${POSTGRES_USER:-web_manga}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-web_manga}
    POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-prefer}
    DBT_TARGET: ${DBT_TARGET:-dev}
  volumes:
    - .:/opt/airflow/project
    - ./services/airflow/dags:/opt/airflow/dags
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web_manga
      POSTGRES_USER: web_manga
      POSTGRES_PASSWORD: web_manga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@web-manga.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  manga-service:
    build: ./services/manga-service
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://web_manga:web_manga@postgres:5432/web_manga}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-local-dev-auth-secret}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-28800}
      AUTH_DEMO_ADMIN_USERNAME: ${AUTH_DEMO_ADMIN_USERNAME:-admin}
      AUTH_DEMO_ADMIN_PASSWORD: ${AUTH_DEMO_ADMIN_PASSWORD:-admin}
      AUTH_DEMO_USER_USERNAME: ${AUTH_DEMO_USER_USERNAME:-reader}
      AUTH_DEMO_USER_PASSWORD: ${AUTH_DEMO_USER_PASSWORD:-reader}
    ports:
      - "8000:8000"

  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      (airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true)"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - airflow-init

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      - postgres
      - airflow-init

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  pgadmin_data:
  minio_data:
  airflow_logs:
