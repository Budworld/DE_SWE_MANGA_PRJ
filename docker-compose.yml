services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web_manga
      POSTGRES_USER: web_manga
      POSTGRES_PASSWORD: web_manga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  manga-service:
    build: ./services/manga-service
    environment:
      DATABASE_URL: postgresql://web_manga:web_manga@postgres:5432/web_manga
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
