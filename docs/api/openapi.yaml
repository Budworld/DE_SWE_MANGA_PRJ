openapi: 3.1.0
info:
  title: Web Manga API
  version: 0.2.0
  description: API served by manga-service from PostgreSQL gold tables.
servers:
  - url: http://localhost:8000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /health:
    get:
      summary: Service health check
      responses:
        "200":
          description: Service status
  /auth/login:
    post:
      summary: Login with local demo credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Bearer token and user role
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
        "401":
          description: Missing or invalid token
  /admin/health:
    get:
      summary: Admin observability health check
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Service and database status
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /admin/pipeline/runs:
    get:
      summary: List recent crawl/load runs
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent pipeline runs with Silver row counts
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /admin/pipeline/summary:
    get:
      summary: Get pipeline count summary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Silver, Gold, and latest Airflow state summary
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /admin/data-quality:
    get:
      summary: Get data quality checks
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Data quality check results with pass, warn, or fail status
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /admin/catalog/stats:
    get:
      summary: Get catalog distribution stats
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Catalog counts by language and status
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /admin/gold-table-counts:
    get:
      summary: Get Gold table row counts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Row counts for Gold tables
        "401":
          description: Missing or invalid token
        "403":
          description: Admin role required
  /manga:
    get:
      summary: List manga from gold catalog
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: original_language
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated manga catalog items
  /manga/{manga_id}:
    get:
      summary: Get manga detail from gold detail table
      parameters:
        - name: manga_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manga detail
        "404":
          description: Manga not found
  /manga/{manga_id}/chapters:
    get:
      summary: List chapters for a manga
      parameters:
        - name: manga_id
          in: path
          required: true
          schema:
            type: string
        - name: translated_language
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 200
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated chapter list
  /chapters/latest:
    get:
      summary: List latest chapters
      parameters:
        - name: translated_language
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: Paginated latest chapters
  /chapters/{source_chapter_id}/pages:
    get:
      summary: Get MangaDex chapter page image URLs
      parameters:
        - name: source_chapter_id
          in: path
          required: true
          schema:
            type: string
        - name: quality
          in: query
          schema:
            type: string
            enum:
              - data_saver
              - full
            default: data_saver
      responses:
        "200":
          description: Chapter page image URLs
        "422":
          description: Invalid quality
