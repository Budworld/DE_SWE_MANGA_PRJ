web_manga:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER', 'web_manga') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD', 'web_manga') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'web_manga') }}"
      schema: dbt
      threads: 4
    supabase:
      type: postgres
      host: "{{ env_var('POSTGRES_HOST') }}"
      port: "{{ env_var('POSTGRES_PORT', '5432') | int }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      pass: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB', 'postgres') }}"
      schema: dbt
      threads: 4
      sslmode: "{{ env_var('POSTGRES_SSLMODE', 'require') }}"
